name: docker_infra_pg-stack

services:
  postgres:
    image: postgres:15
    container_name: docker_infra_pg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docker_infra_pg_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - docker_infra_pg_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - docker_infra_pg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-docker_infra_pg_dev}"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  docker_infra_pg_postgres_data:
    name: docker_infra_pg_postgres_data

networks:
  docker_infra_pg_network:
    name: docker_infra_pg_network
    driver: bridge
